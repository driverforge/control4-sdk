name: Crypto conformance

on:
  push:
    branches: [main]
    paths:
      - src/rs256.lua
      - spec/rs256*_spec.lua
      - spec/support/without_coverage.lua
      - spec/without_coverage_spec.lua
      - spec/fixtures/wycheproof/**
      - .github/workflows/crypto-tests.yml
  pull_request:
    paths:
      - src/rs256.lua
      - spec/rs256*_spec.lua
      - spec/support/without_coverage.lua
      - spec/without_coverage_spec.lua
      - spec/fixtures/wycheproof/**
      - .github/workflows/crypto-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lua: ['5.1.5', 'luajit']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: leafo/gh-actions-lua@35bcb06abec04ec87df82e08caa84d545348536e # v10
        with:
          luaVersion: ${{ matrix.lua }}
      - uses: leafo/gh-actions-luarocks@e65774a6386cb4f24e293dca7fc4ff89165b64c5 # v4
      - name: Install test dependencies
        run: |
          luarocks install busted
          luarocks install lua-cjson
          luarocks install openssl
      - name: Verify fixture checksums
        working-directory: spec/fixtures/wycheproof
        run: sed -n '/^SHA-256:$/,$p' SOURCE.txt | tail -n +2 | sha256sum --check --strict
      - name: Check RS256
        run: busted spec/rs256_spec.lua spec/rs256_conformance_spec.lua spec/rs256_fuzz_spec.lua spec/without_coverage_spec.lua
