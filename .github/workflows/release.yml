name: Release
run-name: Release — v${{ inputs.version }}

# Cuts an SDK release from this repository, which is the public one. That is
# deliberate and is the whole point: an attestation asserts "this workflow, at
# this commit, produced these bytes", so it is only worth anything if the
# workflow and the commit are ones a reader can go and look at. A release built
# behind a closed door and signed by an unobservable process is trust by
# assertion; this is trust you can check.
#
# The artifact is distributed from releases.driverforge.com, not from here —
# attestations bind to the artifact digest rather than to where it is hosted,
# so a user verifies the file they downloaded from releases.driverforge.com
# against an attestation fetched from this repo.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'SDK version to release (e.g., 1.2.0)'
        required: true
        type: string

env:
  # releases.driverforge.com is CloudFront in front of this bucket; every path
  # keeps the `driverforge-releases/` segment the URLs have always had.
  RELEASES_BUCKET: driverforge-prod-releases
  RELEASES_PREFIX: driverforge-releases
  ARTIFACT_PATH: driverforge-sdk
  # The signing key lives in AWS KMS, imported from a key generated offline;
  # KMS will not export it, so signing happens via the KMS API and no key
  # material ever reaches the runner. The id is what the CLI selects the public
  # key by.
  RELEASE_SIGNING_KEY: release-signing-v2
  RELEASE_SIGNING_KEY_ALIAS: alias/driverforge-release-signing-v2

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # The AWS release role trusts exactly
    # repo:driverforge@182759942/control4-sdk@1338941434:environment:release
    # (GitHub's immutable subject, with org and repo IDs), so the environment is
    # what binds this job to the signing identity. Its branch policy restricts
    # deployments to main, so the only commits that can reach the signing key
    # are ones the mirror sync put there — a branch pushed straight to this
    # repository cannot build a release.
    environment: release
    permissions:
      contents: write        # create the tag and the GitHub Release
      id-token: write        # OIDC, for the release role and for the attestation
      attestations: write    # record the provenance statement
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: leafo/gh-actions-lua@35bcb06abec04ec87df82e08caa84d545348536e # v10
        with:
          luaVersion: "5.1"

      - uses: leafo/gh-actions-luarocks@e65774a6386cb4f24e293dca7fc4ff89165b64c5 # v4

      - name: Install dependencies
        # The openssl rock is load-bearing for the test gate: without it the
        # attestation specs self-gate and every real-crypto test silently
        # skips. It is a spec-only dependency — the SDK itself has none.
        run: |
          luarocks install busted
          luarocks install lua-cjson
          luarocks install lbase64
          luarocks install openssl

      - name: Validate version format
        run: |
          VERSION="${{ inputs.version }}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$VERSION' does not match semver format X.Y.Z"
            exit 1
          fi

      - name: Check tag does not already exist
        run: |
          TAG="v${{ inputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi

      - name: Run tests
        run: busted spec/

      - name: Build
        run: ./bin/build

      - name: Stage and package artifacts for publishing
        run: |
          VERSION="${{ inputs.version }}"
          mkdir -p publish
          cp dist/driverforge-sdk.lua publish/driverforge-sdk.lua
          cd publish
          zip "driverforge-sdk-${VERSION}.zip" driverforge-sdk.lua
          rm driverforge-sdk.lua

      # Attest the exact bytes that get published. Any re-zip or repackaging after
      # this point changes the digest and the attestation stops matching what a
      # user downloads, so nothing may touch the file again.
      #
      # Public repositories only: GitHub's attestation store is not available to
      # a private repository on the free plan. The gate is the repository's
      # visibility, so attestation comes back, and blocks a release again, the
      # moment the repository is public.
      - name: Attest build provenance
        id: attest
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: publish/driverforge-sdk-${{ inputs.version }}.zip

      - name: Stage the attestation bundle
        if: steps.attest.outcome == 'success'
        # Published alongside the artifact so verification works offline, via
        # `gh attestation verify --bundle`, without reaching the GitHub API.
        run: |
          VERSION="${{ inputs.version }}"
          cp "${{ steps.attest.outputs.bundle-path }}" \
            "publish/driverforge-sdk-${VERSION}.sigstore.json"

      - name: Generate manifest
        run: |
          VERSION="${{ inputs.version }}"
          BASE_URL="https://releases.driverforge.com/$RELEASES_PREFIX/$ARTIFACT_PATH/v$VERSION"
          # Checksum the exact bytes that get uploaded. The CLI refuses to
          # install an SDK whose manifest has no sha256, so this field is
          # mandatory, not decorative. sha256sum emits lowercase hex.
          #
          # This is also the join between the two mechanisms: the attestation
          # binds this digest to a build, the signature below binds it to a
          # publisher. They answer different questions and neither replaces the
          # other.
          SHA256="$(sha256sum "publish/driverforge-sdk-${VERSION}.zip" | cut -d' ' -f1)"
          jq -n \
            --arg version "$VERSION" \
            --arg tag "v$VERSION" \
            --arg commit "$GITHUB_SHA" \
            --arg releasedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg baseUrl "$BASE_URL" \
            --arg sha256 "$SHA256" \
            '{
              version: $version,
              tag: $tag,
              commit: $commit,
              releasedAt: $releasedAt,
              artifacts: [
                {
                  name: "driverforge-sdk-\($version).zip",
                  url: "\($baseUrl)/driverforge-sdk-\($version).zip",
                  sha256: $sha256,
                  contents: ["driverforge-sdk.lua"]
                }
              ]
            }' \
            > publish/manifest.json

      # The role may write under driverforge-releases/driverforge-sdk/, never
      # delete, and sign with the release key as RS256. Its ARN is a repo
      # variable: `pulumi stack output releasePublisherRoles` → .sdk
      - name: Assume the release role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: us-west-2

      - name: Sign the manifest
        run: |
          set -euo pipefail
          # Sign the file exactly as uploaded. Re-serialising the JSON here
          # would reorder keys and produce a signature the CLI rejects.
          openssl dgst -sha256 -binary publish/manifest.json > manifest.digest
          SIG="$(aws kms sign \
            --key-id "$RELEASE_SIGNING_KEY_ALIAS" \
            --message fileb://manifest.digest --message-type DIGEST \
            --signing-algorithm RSASSA_PKCS1_V1_5_SHA_256 \
            --query Signature --output text)"
          rm manifest.digest
          jq -n \
            --arg keyId "$RELEASE_SIGNING_KEY" \
            --arg sig "$SIG" \
            '{alg: "RS256", keyId: $keyId, sig: $sig}' \
            > publish/manifest.json.sig

      - name: Upload to the releases bucket
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          DEST="s3://$RELEASES_BUCKET/$RELEASES_PREFIX/$ARTIFACT_PATH"
          ZIP="publish/driverforge-sdk-${VERSION}.zip"
          BUNDLE="publish/driverforge-sdk-${VERSION}.sigstore.json"
          MANIFEST="publish/manifest.json"
          SIGNATURE="publish/manifest.json.sig"
          IMMUTABLE="public, max-age=31536000, immutable"
          LATEST="no-cache, must-revalidate"

          # Versioned path: immutable, filename includes version
          aws s3 cp "$ZIP" "$DEST/v$VERSION/driverforge-sdk-${VERSION}.zip" --cache-control "$IMMUTABLE"
          aws s3 cp "$MANIFEST" "$DEST/v$VERSION/manifest.json" --cache-control "$IMMUTABLE"
          aws s3 cp "$SIGNATURE" "$DEST/v$VERSION/manifest.json.sig" --cache-control "$IMMUTABLE"

          # Latest path: no-cache, stable filename so direct-download URLs
          # don't break between versions.
          aws s3 cp "$ZIP" "$DEST/latest/driverforge-sdk-latest.zip" --cache-control "$LATEST"
          aws s3 cp "$MANIFEST" "$DEST/latest/manifest.json" --cache-control "$LATEST"
          # latest/manifest.json is byte-identical to the versioned copy, so
          # the same signature covers both.
          aws s3 cp "$SIGNATURE" "$DEST/latest/manifest.json.sig" --cache-control "$LATEST"

          # The provenance bundle, where there is one (see "Attest build provenance").
          if [ -e "$BUNDLE" ]; then
            aws s3 cp "$BUNDLE" "$DEST/v$VERSION/driverforge-sdk-${VERSION}.sigstore.json" --cache-control "$IMMUTABLE"
            aws s3 cp "$BUNDLE" "$DEST/latest/driverforge-sdk-latest.sigstore.json" --cache-control "$LATEST"
          fi

      - name: Create GitHub Release and tag
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            publish/driverforge-sdk-${{ inputs.version }}.zip
            publish/driverforge-sdk-${{ inputs.version }}.sigstore.json
