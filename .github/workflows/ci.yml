name: CI

# Public CI for the Anvil Control4 SDK. This runs on the MIRROR
# (control4-sdk), whose repo root IS the SDK. It lives at
# sdk/.github/workflows/ in the private monorepo purely so it syncs here — only
# the repo-root .github/workflows/ is active in the private repo, so this does
# not run there. No secrets, so it runs on fork PRs (the normal contributor case).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Driverforge driver-CI toolchain: Lua 5.1, LuaRocks, busted, squish. Image
    # is public, so it works on fork PRs (the normal contributor case) which
    # can't authenticate to pull a private image.
    container: ghcr.io/driverforge/anvil-lua:1.0.0
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run tests
        run: busted spec/

      - name: Verify build
        run: ./bin/build
